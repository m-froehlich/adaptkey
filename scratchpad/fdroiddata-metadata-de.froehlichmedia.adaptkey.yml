# Draft for fdroiddata's metadata/de.froehlichmedia.adaptkey.yml
#
# This file is NOT consumed by this repo's own build - it is the exact content to place at
# metadata/de.froehlichmedia.adaptkey.yml in the MR's own branch (m-froehlich-master-patch-41126) on
# gitlab.com/fdroid/fdroiddata. Kept here (scratchpad) as the durable, version-controlled source of
# truth for every future update to that file, since the canonical copy lives in a different repository
# this project does not control.
#
# 2026-09-12 revision: trimmed to a single Builds entry (the reviewer duckniii/seeker's explicit ask -
# "remove all other version from Builds block only keep the latest version"), pointing at v1.2.46
# (versionCode 542), the version the user deliberately brought to a solid state before wanting F-Droid's
# very first listing to reflect it. Reproducible Builds (Binaries:/AllowedAPKSigningKeys:) deliberately
# NOT added - that item sits under the MR template's own "Suggested" tier, not "Required", non-
# reproducibility only skips publishing that one version rather than blocking inclusion, and there is no
# existing install base via GitHub Releases to protect from a signing-key switch (also, Play Store
# distribution - already planned - would use Google's own managed signing key regardless, so even a
# perfectly reproducible F-Droid build could never unify all three channels' signatures anyway).
#
# `scandelete` covers every language-pack ZIP actually in the repo at v1.2.46 (30, not the original 2 -
# the roster grew hugely between the July submission and this revision; re-derive this list live from
# `git ls-tree -r --name-only <tag> -- language-packs/` if it changes again, never copy forward). F-Droid's
# scandelete of gradle-wrapper.jar deliberately.
#
# `AutoName: AdaptKey` matches what fdroidserver's own checkupdates auto-detects from the real built
# AndroidManifest.xml - verified against a real `fdroid checkupdates` CI run, not guessed.


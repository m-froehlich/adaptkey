# Draft for fdroiddata's metadata/de.froehlichmedia.adaptkey.yml
#
# This file is NOT consumed by this repo's own build - it is the exact content to place at
# metadata/de.froehlichmedia.adaptkey.yml in the MR's own branch (m-froehlich-master-patch-41126) on
# gitlab.com/fdroid/fdroiddata. Kept here (scratchpad) as the durable, version-controlled source of
# truth for every future update to that file, since the canonical copy lives in a different repository
# this project does not control.
#
# 2026-09-12 revision: trimmed to a single Builds entry (reviewer duckniii/seeker's ask). 2026-09-23:
# `subdir: app` added and scandelete reduced to one glob (reviewers duckniii/seeker and linsui); both
# reviewers then pressed on reproducible builds ("So why not?"), so it is now enabled: Binaries points at
# the developer-signed AdaptKey.apk attached to the GitHub release of the same tag, AllowedAPKSigningKeys
# is the SHA-256 of the release certificate (verified via apksigner on the built APK). Local evidence the
# build is deterministic: two independent clean checkouts of v1.2.47 at different paths produced APKs with
# identical entries, order and timestamps (only the signing block differs). Unverified: a Linux/F-Droid
# build - no WSL/Docker on the dev machine. If F-Droid's comparison fails it skips publishing that one
# version; fix from their diff or drop Binaries again.
#
# `AutoName: AdaptKey` matches what fdroidserver's own checkupdates auto-detects from the real built
# AndroidManifest.xml - verified against a real `fdroid checkupdates` CI run, not guessed.


#
# 2026-09-24: retargeted to v1.2.65 (versionCode 561). The APK of v1.2.47 failed F-Droid's `check apk`
# (extra signing block 'Dependency metadata') after its build comparison had already passed except for
# AGP's embedded git revision; v1.2.65 is the first version whose build config (D-481) removes both.


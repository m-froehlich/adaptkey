Builds:
  - versionName: 1.2.65
    versionCode: 561
    commit: 8c12bf20983704be23bb507bc9739628726e6deb
    subdir: app
    gradle:
      - yes
    output: build/outputs/apk/release/AdaptKey.apk
    scandelete:
      - language-packs/*.zip

AllowedAPKSigningKeys: 3201509b76f26c1c209b1a39aedb36a57fe331c4b418e0c0892115ed3ee3666e

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.2.65
